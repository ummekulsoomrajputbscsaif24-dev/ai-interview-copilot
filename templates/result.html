<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>Interview Results</h1>
    <p>Predicted role: <b>{{ category }}</b></p>
    <h2>Overall score: {{ avg }}/100</h2>

    {% for r in rows %}
    <div class="result-item">
      <p><b>Q{{ loop.index }}. {{ r.question }}</b></p>
      <p>Your answer: {{ r.answer or "(no answer)" }}</p>
      <p>Score: <b>{{ r.score }}/100</b></p>
      <p class="fb">{{ r.feedback }}</p>
    </div>
    {% endfor %}

    <a href="/"><button type="button">Try Again</button></a>
  </div>
</body>
</html>
